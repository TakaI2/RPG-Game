<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>エフェクトエディタ</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      --bg: #1e1e2e; --panel: #181825; --line: #45475a; --text: #cdd6f4; --sub: #a6adc8;
      --accent: #f5a97f; --accent2: #89b4fa; --danger: #f38ba8; --ok: #a6e3a1;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px 'Segoe UI', 'Meiryo', sans-serif; overflow: hidden; }
    button, select, input { font: inherit; color: var(--text); background: #313244;
      border: 1px solid var(--line); border-radius: 4px; }
    button { padding: 4px 10px; cursor: pointer; }
    button:hover { border-color: var(--accent2); }
    button.primary { background: #7c4a2d; border-color: var(--accent); }
    button.danger:hover { border-color: var(--danger); }
    input[type=number], input[type=text] { padding: 3px 6px; width: 100%; }
    input[type=range] { width: 100%; }
    input[type=color] { width: 40px; height: 24px; padding: 0; }
    select { padding: 3px 4px; }

    #app { display: grid; height: 100vh;
      grid-template-columns: 250px 1fr 360px; grid-template-rows: auto 1fr 170px;
      grid-template-areas: "top top top" "left center right" "left timeline right"; }

    #toolbar { grid-area: top; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    #toolbar .group { display: flex; gap: 6px; align-items: center; }
    #toolbar .sep { width: 1px; height: 22px; background: var(--line); }
    #toolbar label { color: var(--sub); }
    #dirty { color: var(--accent); min-width: 60px; }

    #left { grid-area: left; border-right: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0; }
    #left h3, #right h3 { margin: 0; padding: 8px 12px; font-size: 13px; color: var(--sub);
      border-bottom: 1px solid var(--line); }
    #layer-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
    #layer-list { list-style: none; margin: 0; padding: 4px 8px; overflow-y: auto; flex: 1; }
    #layer-list li { display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-bottom: 3px;
      border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
    #layer-list li:hover { background: #313244; }
    #layer-list li.selected { border-color: var(--accent); background: #3a2f2a; }
    #layer-list li.disabled .lname { opacity: 0.45; text-decoration: line-through; }
    #layer-list .ltype { font-size: 11px; padding: 1px 5px; border-radius: 3px; }
    .t-sprite { background: #45475a; color: #f9e2af; }
    .t-shape { background: #45475a; color: #89dceb; }
    .t-particle { background: #45475a; color: #f5c2e7; }
    #layer-list .lname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #layer-ops { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 8px;
      border-top: 1px solid var(--line); }

    #center { grid-area: center; position: relative; min-width: 0; min-height: 0;
      display: flex; flex-direction: column; }
    #preview-bar { display: flex; gap: 10px; align-items: center; padding: 6px 10px; flex-wrap: wrap;
      border-bottom: 1px solid var(--line); background: #11111b; }
    #preview-bar label { color: var(--sub); display: flex; gap: 4px; align-items: center; }
    #preview { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      background: #0b0b12; }
    #preview canvas { max-width: 100%; max-height: 100%; }
    #hint { position: absolute; right: 10px; bottom: 8px; color: #6c7086; font-size: 11px; pointer-events: none; }

    #timeline { grid-area: timeline; border-top: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; min-width: 0; }
    #timeline-head { display: flex; justify-content: space-between; padding: 4px 10px; color: var(--sub); }
    #timeline-body { position: relative; flex: 1; overflow-y: auto; padding: 0 10px 6px; }
    .tl-row { position: relative; height: 20px; margin: 3px 0; background: #11111b; border-radius: 3px; }
    .tl-bar { position: absolute; top: 2px; height: 16px; border-radius: 3px; cursor: grab;
      font-size: 10px; line-height: 16px; padding: 0 4px; white-space: nowrap; overflow: hidden; color: #11111b; }
    .tl-bar.sprite { background: #f9e2af; } .tl-bar.shape { background: #89dceb; } .tl-bar.particle { background: #f5c2e7; }
    .tl-bar.infinite { background-image: repeating-linear-gradient(45deg, transparent 0 6px, rgba(0,0,0,.25) 6px 12px); }
    .tl-bar.selected { outline: 2px solid var(--accent); }
    .tl-bar.off { opacity: .35; }
    #playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); pointer-events: none; }

    #right { grid-area: right; border-left: 1px solid var(--line); background: var(--panel);
      display: flex; flex-direction: column; min-height: 0; }
    #tabs { display: flex; border-bottom: 1px solid var(--line); }
    #tabs button { flex: 1; border: none; border-radius: 0; background: transparent; padding: 8px; color: var(--sub); }
    #tabs button.active { color: var(--text); border-bottom: 2px solid var(--accent); }
    .tab { display: none; overflow-y: auto; padding: 10px 12px; flex: 1; }
    .tab.active { display: block; }
    .field { display: grid; grid-template-columns: 110px 1fr 64px; gap: 6px; align-items: center; margin-bottom: 6px; }
    .field.wide { grid-template-columns: 110px 1fr; }
    .field > label { color: var(--sub); font-size: 12px; }
    .section { margin: 12px 0 6px; padding-top: 8px; border-top: 1px dashed var(--line);
      color: var(--accent2); font-size: 12px; }
    .muted { color: #6c7086; font-size: 12px; }
    #sheet-canvas { width: 100%; background: #11111b; border: 1px solid var(--line); image-rendering: pixelated; }
    #sheet-list { list-style: none; padding: 0; margin: 0 0 8px; }
    #sheet-list li { padding: 5px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; }
    #sheet-list li:hover { background: #313244; }
    #sheet-list li.selected { background: #3a2f2a; }
    .bind-row { display: grid; grid-template-columns: 120px 1fr 44px; gap: 6px; align-items: center; margin-bottom: 6px; }

    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 16px;
      border-radius: 6px; background: #313244; border: 1px solid var(--line); opacity: 0; transition: opacity .2s;
      pointer-events: none; z-index: 20; }
    #toast.show { opacity: 1; }
    #toast.error { border-color: var(--danger); color: var(--danger); }
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center;
      justify-content: center; z-index: 10; }
    #modal.show { display: flex; }
    #modal .box { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 18px;
      min-width: 340px; max-height: 70vh; display: flex; flex-direction: column; gap: 10px; }
    #modal ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
    #modal li { padding: 8px 10px; border-radius: 5px; cursor: pointer; }
    #modal li:hover { background: #313244; }
  </style>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <div class="group">
        <button id="btn-new">新規</button>
        <button id="btn-open">開く</button>
        <button id="btn-save" class="primary">保存</button>
        <button id="btn-save-as">別名保存</button>
        <span id="dirty"></span>
      </div>
      <div class="sep"></div>
      <div class="group"><label>ID</label><input id="preset-id" type="text" style="width:140px" /></div>
      <div class="group"><label>名前</label><input id="preset-name" type="text" style="width:160px" /></div>
      <div class="group"><label>全体の拡大率</label><input id="preset-scale" type="number" step="0.05" min="0.05" style="width:70px" /></div>
      <div class="group"><label>速度</label><input id="preset-speed" type="number" step="0.05" min="0.05" style="width:70px" /></div>
      <div class="group"><label><input id="preset-follow" type="checkbox" /> 対象に追従</label></div>
    </div>

    <div id="left">
      <h3>レイヤー（上ほど奥）</h3>
      <div id="layer-buttons">
        <button data-add="sprite">＋シート</button>
        <button data-add="shape">＋図形</button>
        <button data-add="particle">＋粒子</button>
      </div>
      <ul id="layer-list"></ul>
      <div id="layer-ops">
        <button id="btn-up" title="上へ">▲</button>
        <button id="btn-down" title="下へ">▼</button>
        <button id="btn-dup" title="複製">複製</button>
        <button id="btn-del" class="danger" title="削除">削除</button>
      </div>
    </div>

    <div id="center">
      <div id="preview-bar">
        <button id="btn-play" class="primary">▶ 再生 (Space)</button>
        <label><input id="opt-repeat" type="checkbox" checked /> 繰り返し</label>
        <label>間隔 <input id="opt-interval" type="number" value="1200" step="100" min="200" style="width:70px" /> ms</label>
        <label><input id="opt-replay" type="checkbox" checked /> 変更時に再生</label>
        <label><input id="opt-follow-mouse" type="checkbox" /> マウスに追従</label>
        <label><input id="opt-dummy" type="checkbox" checked /> プレイヤー表示</label>
        <label>背景 <select id="opt-bg"><option value="grass">草地</option><option value="stone">石畳</option><option value="dark">暗</option></select></label>
        <label>ズーム <select id="opt-zoom"><option value="1">1.0</option><option value="1.5" selected>1.5（ゲーム）</option><option value="2">2.0</option></select></label>
      </div>
      <div id="preview"></div>
      <div id="hint">クリックした位置で再生 ／ 同時再生数: <span id="active-count">0</span></div>
    </div>

    <div id="timeline">
      <div id="timeline-head"><span>タイムライン（帯をドラッグで開始時刻を変更）</span><span id="timeline-scale"></span></div>
      <div id="timeline-body"><div id="playhead"></div></div>
    </div>

    <div id="right">
      <div id="tabs">
        <button data-tab="tab-layer" class="active">レイヤー設定</button>
        <button data-tab="tab-sheets">シート</button>
        <button data-tab="tab-bindings">割り当て</button>
      </div>
      <div id="tab-layer" class="tab active"></div>
      <div id="tab-sheets" class="tab">
        <ul id="sheet-list"></ul>
        <canvas id="sheet-canvas" width="320" height="320"></canvas>
        <div id="sheet-form" style="margin-top:8px"></div>
        <button id="btn-save-manifest" class="primary" style="margin-top:8px;width:100%">シート設定を保存</button>
        <p class="muted">public/assets/fx/sheets/ に png を置くと「未登録」として表示されます。</p>
      </div>
      <div id="tab-bindings" class="tab">
        <p class="muted">サバイバーモードの各場面で再生するエフェクト。「従来の演出」は組み込みのエフェクトを使います。</p>
        <div id="bind-list"></div>
        <button id="btn-save-bindings" class="primary" style="margin-top:8px;width:100%">割り当てを保存</button>
      </div>
    </div>
  </div>

  <div id="modal"><div class="box"><strong id="modal-title"></strong><ul id="modal-list"></ul><button id="modal-close">閉じる</button></div></div>
  <div id="toast"></div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
